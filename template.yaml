    Properties:
      CodeUri: ./cmd/functions/user/delete_user
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: delete
            Path: /users/{userId}
            RestApiId: !Ref Api

  GetVehicles:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/vehicle/get_vehicles
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /vehicles
            RestApiId: !Ref Api

  RegisterVehicle:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/vehicle/register_vehicle
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /vehicles
            RestApiId: !Ref Api

  RemoveVehicle:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/vehicle/remove_vehicle
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: delete
            Path: /vehicles/{numberplate}
            RestApiId: !Ref Api

  AddParking:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/parking/add_parking
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /parkings
            RestApiId: !Ref Api

  GetParkings:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/parking/get_parkings
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /parkings
            RestApiId: !Ref Api

  UnparkVehicle:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/parking/unpark_vehicle
