# yaml-language-server: $schema=https://raw.githubusercontent.com/aws/serverless-application-model/main/samtranslator/schema/schema.json
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Architectures:
      - x86_64
    Timeout: 200
    Handler: bootstrap
    Runtime: provided.al2023

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1

  Login:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/auth/login
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /auth/login
            RestApiId: !Ref Api

  Signup:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/auth/signup
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /auth/register
            RestApiId: !Ref Api

  GetBuildings:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/building/get_buildings
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /buildings
            RestApiId: !Ref Api

  AddBuilding:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/building/add_building
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /buildings
            RestApiId: !Ref Api

  DeleteBuilding:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/building/delete_building
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: delete
            Path: /buildings/{buildingId}
            RestApiId: !Ref Api

  GetFloors:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/floor/get_floors
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /buildings/{buildingId}/floors
            RestApiId: !Ref Api

  AddFloor:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/floor/add_floor
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /buildings/{buildingId}/floors
            RestApiId: !Ref Api

  DeleteFloor:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/floor/delete_floor
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: delete
            Path: /buildings/{buildingId}/floors/{floorId}
            RestApiId: !Ref Api

  GetBuildingOffices:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/office/get_offices
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /buildings/{buildingId}/offices
            RestApiId: !Ref Api

  GetAllOffices:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/office/get_all_offices
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /offices
            RestApiId: !Ref Api

  AddOffice:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/office/add_office
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: post
            Path: /buildings/{buildingId}/offices
            RestApiId: !Ref Api

  DeleteOffice:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/office/delete_office
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: delete
            Path: /buildings/{buildingId}/offices/{officeId}
            RestApiId: !Ref Api

  GetSlots:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/slot/get_slots
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /buildings/{buildingId}/floors/{floorId}/slots
            RestApiId: !Ref Api

  GetUsers:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/user/get_users
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Method: get
            Path: /users
            RestApiId: !Ref Api

  UpdateUser:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: ./cmd/functions/user/update_user
      Events:
